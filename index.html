<header class="heading"><h1>倉庫 PDA 上架・模擬情境</h1><p>個人作業構想，模擬兩種操作方式，供交流討論。</p></header>
<details class="purpose" id="purpose"><summary>這個模擬想探討什麼？</summary><ul>
<li><strong>少一點重複操作：</strong>減少往返查詢與重掃商品車。</li>
<li><strong>不用自己記數量：</strong>直接看到已上架與剩餘數量。</li>
<li><strong>避免誤關整車：</strong>尚有商品未完成時，阻擋完成動作。</li>
<li><strong>減少對車碼的依賴：</strong>首次掃描後，在同一次未中斷作業中接續上架。</li>
</ul><p>個人作業構想，供情境討論；實際可行性仍需依現場系統確認。</p></details>

const escapePattern=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const translations=COPY.map(([source,en,ko])=>{const keys=[];const pattern=source.split(/(\{\w+\})/).map(part=>{if(/^\{\w+\}$/.test(part)){const key=part.slice(1,-1);keys.push(key);return ['n','done','total'].includes(key)?'(\\d+)':'(.+?)';}return escapePattern(part);}).join('');return {source,en,ko,keys,re:new RegExp('^'+pattern+'$')};});
function translate(text){if(language==='zh-Hant')return text;const trimmed=text.trim();const exact=translations.find(r=>r.source===trimmed);if(exact)return text.replace(trimmed,exact[language]);for(const row of translations){if(!row.keys.length)continue;const match=trimmed.match(row.re);if(match){const values=Object.fromEntries(row.keys.map((k,i)=>[k,match[i+1]]));const output=row[language].replace(/\{(\w+)\}/g,(_,key)=>{const value=values[key];const item=translations.find(r=>r.source===value);return item?item[language]:value;});return text.replace(trimmed,output);}}return text;}

function localize(){document.documentElement.lang=language;document.title=translate('倉庫 PDA｜作業情境模擬');const walker=document.createTreeWalker(document.querySelector('main'),NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){if(node.parentElement.closest('select'))continue;if(!sourceText.has(node))sourceText.set(node,node.nodeValue);node.nodeValue=translate(sourceText.get(node));}document.querySelector('.tabs').setAttribute('aria-label',translate('切換操作流程'));document.getElementById('app').setAttribute('aria-label',translate('PDA 操作畫面'));document.getElementById('language').setAttribute('aria-label',translate('語言'));}
const PRODUCTS=[{name:'泡麵',sku:'4710001234567',total:100},{name:'飲料',sku:'4710002234567',total:30},{name:'糖果',sku:'4710003234567',total:20}];
const LOCATIONS=['A01','A05','B03','B08'];
function fresh(){return {page:'home',items:PRODUCTS.map(p=>({...p,placed:0})),selected:null,location:'',inputs:{},queried:false,loaded:false,error:'',returnPage:'overview',lastQuantity:0};}
const states={current:fresh(),improved:fresh()};let mode='current';
const state=()=>states[mode], improved=()=>mode==='improved', remaining=p=>p.total-p.placed, pending=()=>state().items.filter(p=>remaining(p)>0), product=()=>state().items[state().selected];
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,style='',value)=>`<button type="button" class="full ${style}" data-action="${action}" ${value===undefined?'':`data-value="${esc(value)}"`}>${label}</button>`;
function go(page){state().page=page;state().error='';}
function field(key,label,numeric=false){return `<label for="${key}">${label}</label><input id="${key}" data-input="${key}" value="${esc(state().inputs[key]||'')}" ${numeric?'inputmode="numeric"':'autocapitalize="characters"'} autocomplete="off" spellcheck="false">`;}
function scan(key,action,options){return `<div class="barcode" aria-hidden="true"></div><div class="stack">${options.map(o=>button('模擬掃描 '+esc(o.label),action,'',o.code)).join('')}</div><details ${state().inputs[key]?'open':''}><summary>手動輸入條碼</summary><form data-submit="${action}">${field(key,'條碼')}<button type="submit" class="secondary full">確認條碼</button></form></details>`;}
function rows(items,query=false){return `<div class="rows">${items.map(p=>`<div class="row"><span>${p.name}${query?'':`<small>${p.placed} / ${p.total} 已上架</small>`}</span><b class="${remaining(p)?'':'success'}">${query?remaining(p):remaining(p)?'剩餘 '+remaining(p):'✓ 完成'}</b></div>`).join('')}</div>`;}
function metrics(p){return `<div class="metrics"><div class="metric">總數<b>${p.total}</b></div><div class="metric">已上架<b>${p.placed}</b></div><div class="metric remaining">剩餘<b>${remaining(p)}</b></div></div>`;}
// The completion guard is independent of button appearance.
function finish(){const s=state();if(!s.loaded||s.page==='closed')return;if(pending().length){s.returnPage=s.page;go(improved()?'blocked':'risk');return;}go('closed');}
function act(action,value){const s=state(),p=product();s.error='';
 switch(action){
 case 'query':go('queryScan');break;
 case 'home':go('home');break;
 case 'shelf':if(!improved()&&!s.queried){s.error='請先進入貨物查詢，查看本車商品。';break;}go('cartScan');break;
 case 'queryCart':case 'cart':{const key=action==='cart'?'cartCode':'queryCode';if((value??s.inputs[key]??'').trim()!=='CART-001'){s.error='找不到商品車，請使用 CART-001。';break;}s.inputs[key]='';if(action==='queryCart'){s.queried=true;go('queryList');}else{s.loaded=true;go(improved()?'overview':'productScan');}break;}
 case 'start':case 'nextProduct':go('productScan');break;
 case 'product':{const n=s.items.findIndex(x=>x.sku===(value??s.inputs.productCode??'').trim());if(n<0){s.error='此商品不屬於目前商品車。（Prototype 示意）';break;}if(!remaining(s.items[n])){s.error='此商品已完成上架。';break;}s.selected=n;s.location='';s.inputs.productCode='';s.inputs.locationCode='';s.inputs.quantity='';go('location');break;}
 case 'nextLocation':s.location='';s.inputs.locationCode='';s.inputs.quantity='';go('location');break;
 case 'location':{const code=(value??s.inputs.locationCode??'').trim().toUpperCase();if(!LOCATIONS.includes(code)){s.error='請使用 A01、A05、B03 或 B08 儲位。';break;}s.location=code;s.inputs.locationCode='';go('quantity');break;}
 case 'put':{if(s.page!=='quantity'||!p||!s.location)break;const raw=(s.inputs.quantity||'').trim(),n=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(n)||n<=0){s.error='請輸入大於 0 的整數。';break;}if(n>remaining(p)){s.error=`上架數量不可超過剩餘數量 ${remaining(p)}。`;break;}p.placed+=n;s.lastQuantity=n;s.inputs.quantity='';go(improved()&&!remaining(p)?'productDone':'success');break;}
 case 'forget':go('forgot');break;
 case 'list':s.returnPage=s.page;go('list');break;
 case 'return':go(s.returnPage);break;
 case 'finish':finish();break;
 case 'resume':go(s.returnPage);break;
 }render(true);
}
const titles={home:'主選單',queryScan:'貨物查詢',queryList:'貨物查詢',cartScan:'陳列（上架）',overview:'陳列（上架）',productScan:'陳列（上架）',location:'陳列（上架）',quantity:'陳列（上架）',success:'陳列（上架）',productDone:'陳列（上架）',list:'本車商品',forgot:'返回貨物查詢',risk:'模擬現行風險',blocked:'完成動作已阻擋',closed:'商品車已完成'};
function render(focus=false){const s=state(),p=product(),is=improved(),left=pending().length;let html='';
 switch(s.page){
 case 'home':html=`<h2>請選擇作業</h2><p class="muted">${is?'直接進入陳列，即可查看本車商品。':s.queried?'已查詢商品，接著進入陳列。':'先查詢本車商品，再回來進入陳列。'}</p><div class="stack">${!is?button('貨物查詢','query',s.queried?'secondary':''):''}${button('陳列（上架）','shelf',!is&&!s.queried?'secondary':'')}</div>`;break;
 case 'queryScan':case 'cartScan':html=`<h2>請掃描商品車</h2><p class="muted">${s.page==='cartScan'&&!is?'進入陳列，需要再掃一次同一台車。':'Demo 商品車：CART-001'}</p>${scan(s.page==='queryScan'?'queryCode':'cartCode',s.page==='queryScan'?'queryCart':'cart',[{label:'CART-001',code:'CART-001'}])}${button('回主選單','home','secondary')}`;break;
 case 'queryList':html=`<h2>本車尚待上架商品</h2><p class="muted">CART-001 · 共 ${left} 項</p>${rows(pending(),true)}${left?'':'<div class="notice ok">所有商品已上架。</div>'}<p class="muted">完成的商品會從此清單消失。</p>${button('回主選單','home')}`;break;
 case 'overview':html=`<h2>${left?'本車商品':'✓ 所有商品均已上架'}</h2>${rows(s.items)}${left?button('開始上架','start'):''}`;break;
 case 'productScan':html=`<h2>請掃描商品</h2>${scan('productCode','product',s.items.map(x=>({label:x.name,code:x.sku})))}`;break;
 case 'location':html=`<h2>${p.name}</h2>${is?metrics(p):''}<p><strong>下一步：掃描儲位</strong></p>${scan('locationCode','location',LOCATIONS.map(x=>({label:x,code:x})))}`;break;
 case 'quantity':html=`<h2>${p.name}</h2><p><strong>儲位：${s.location}</strong></p>${is?metrics(p):''}<form data-submit="put">${field('quantity','請輸入本次上架數量',true)}<button type="submit" class="full">上架</button></form><p class="route">${p.name==='泡麵'?'示範分放：A01 25、A05 25、B03 30、B08 20。':`示範：${p.name}一次放 ${p.total}。`}</p>${button('重掃儲位','nextLocation','quiet')}`;break;
 case 'success':html=`<div class="mark success">✓</div><h2 class="success">上架成功</h2>${is?`<p>${p.name} · ${s.location} · 本次 ${s.lastQuantity}</p>${metrics(p)}${button('掃描下一儲位','nextLocation')}`:`<p class="muted">同商品換儲位，仍需重新掃描商品。<br>若認為商品已做完，請回貨物查詢確認。</p>${button('掃描商品，繼續上架','nextProduct')}`}`;break;
 case 'productDone':html=`<div class="mark success">✓</div><h2 class="success">${p.name}已完成</h2>${metrics(p)}<div class="notice ${left?'':'ok'}">${left?`本車尚有 <strong>${left} 項</strong> 未完成。`:'✓ 所有商品均已上架'}</div>${rows(pending(),true)}${left?button('掃下一項商品','nextProduct'):''}`;break;
 case 'list':html=`<h2>本車商品</h2>${rows(s.items)}${button('返回原操作畫面','return')}`;break;
 case 'forgot':html=`<h2>需要再查一次</h2><div class="notice">陳列畫面看不到累計或剩餘。<br>請離開陳列，回貨物查詢確認。</div>${button('進貨物查詢','query')}`;break;
 case 'risk':html=`<div class="mark" style="color:#b72237">✕</div><h2>誤關整台商品車</h2><div class="notice error">只做完其中一項，卻按了「完成／清除」。本車仍有商品未完成：</div>${rows(pending(),true)}<p class="muted">這是現行風險模擬，Demo 保留資料。</p>${button('返回陳列','resume')}`;break;
 case 'blocked':html=`<div class="mark" style="color:#b72237">⚠</div><h2>無法完成商品車</h2><p>尚有：</p>${rows(pending(),true)}<div class="notice error">未完成商品仍存在，請先完成後再關閉。</div>${button('繼續上架','resume')}`;break;
 case 'closed':html='<div class="mark success">✓</div><h2 class="success">CART-001 已完成</h2><div class="notice ok">所有商品均已上架 · 3 / 3 完成</div><p class="muted">可切換另一種流程體驗差異。</p>';break;
 }
 const shelving=s.loaded&&!['home','queryScan','queryList','cartScan','forgot','closed'].includes(s.page);
 const progress=is&&shelving?`<div class="progress">CART-001 · 本車共 3 項<strong>${3-left} / 3 完成 · 尚有 ${left} 項</strong></div>`:'';
 const footer=shelving&&!['risk','blocked'].includes(s.page)?`<div class="footer">${is?`${s.page!=='list'?button('查看本車商品','list','secondary'):''}${button('完成商品車','finish',left?'warning':'')}`:`${button('回貨物查詢確認','forget','secondary')}${button('完成／清除','finish','warning')}`}</div>`:'';
 document.getElementById('app').innerHTML=`<div class="bar"><span>${titles[s.page]}</span><small>${is?'構想作業情境':'原作業情境'}</small></div>${progress}<div class="content">${html}${s.error?`<div role="alert" tabindex="-1" class="notice error">${esc(s.error)}</div>`:''}</div>${footer}`;
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 localize();
 if(focus){const target=document.querySelector(s.error?'[role="alert"]':'#app h2');if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});target.scrollIntoView({block:'nearest'});}}
}
// Ignore stale controls removed after submission, so rapid taps cannot double-post.
 document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.isConnected)return;if(b.dataset.mode){mode=b.dataset.mode;render();return;}if(b.id==='restart'){states[mode]=fresh();render();return;}if(b.dataset.action)act(b.dataset.action,b.dataset.value);});
 document.addEventListener('submit',e=>{if(e.target.matches('[data-submit]')){e.preventDefault();if(e.target.isConnected)act(e.target.dataset.submit);}});
 document.addEventListener('input',e=>{if(e.target.dataset.input)state().inputs[e.target.dataset.input]=e.target.value;});
 document.getElementById('language').addEventListener('change',e=>{language=e.target.value;localize();});
 render();
</script>
</body>
</html>
